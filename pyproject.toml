[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fm-fiscal-core"
version = "0.1.0.dev0"
description = "FM Fiscal Core — motor fiscal brasileiro modular, multiproduto e desacoplado da FM Tecnologia."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary-compatible public development; license TBD before release"}
authors = [{name = "FM Tecnologia"}]
dependencies = [
  "cryptography>=50,<51",
  "lxml>=5.3,<7",
  "google-cloud-secret-manager>=2.31,<3",
  "google-crc32c>=1.8,<2",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]
telemetry = [
  "opentelemetry-sdk>=1.35,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.35,<2",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
]
dev = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "httpx>=0.28,<1",
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kordena_fiscal.cognitive.knowledge" = ["official/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true
