# RTC-RFB-02/06 opt-in overlay: the two official Receita Federal RTC calculators
# (Simples Nacional and Regime Regular) as INTERNAL services, shadow only.
# Not part of the default deploy. No published ports, read-only database.
# 1) Database (once per pin):
#      docker build --output type=local,dest=/opt/fm/nfcore/rtc-db ../rfb/database
# 2) Services:
#      NFCORE_RTC_DB_DIR=/opt/fm/nfcore/rtc-db docker compose -f compose.prod.yml \
#        -f compose.rtc-calculators.opt-in.yml up -d nfcore-rtc-simples nfcore-rtc-regime-regular
x-rtc-common: &rtc
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  volumes:
    - type: bind
      source: ${NFCORE_RTC_DB_DIR:?build-deploy/rfb/database-first}
      target: /app/calculadora/db
      read_only: true
  mem_limit: 768m
  cpus: 1.0
  security_opt:
    - no-new-privileges:true

services:
  nfcore-rtc-simples:
    <<: *rtc
    build:
      context: ../rfb/simples
    image: nfcore-rtc-simples:a926d5a7
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8082 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
  nfcore-rtc-regime-regular:
    <<: *rtc
    build:
      context: ../rfb/regime-regular
    image: nfcore-rtc-regime-regular:f1eebd7c
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
