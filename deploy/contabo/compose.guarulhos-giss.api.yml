# Opt-in reviewed homologation on the existing API; does not enable fiscal production.
services:
  api:
    environment:
      NFCORE_GUARULHOS_GISS_CONFIG_PATH: /run/nfcore/guarulhos/manifest.json
    volumes:
      - type: bind
        source: ${NFCORE_GUARULHOS_REVIEWED_HOST_DIR:?Reviewed Guarulhos contract directory required}
        target: /run/nfcore/guarulhos
        read_only: true
        bind:
          create_host_path: false
