name: FM NFCORE V1 CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - production
  push:
    branches:
      - main
      - "feat/nfcore-web-*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nfcore_test
          POSTGRES_USER: nfcore
          POSTGRES_PASSWORD: nfcore_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nfcore -d nfcore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NFCORE_TEST_POSTGRES_DSN: postgresql://nfcore:nfcore_test_password@127.0.0.1:5432/nfcore_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Repository secret scan
        run: python scripts/ci/check_repository_secrets.py

      - name: Install Python
        run: python -m pip install -e ".[dev]"

      - name: Validate canonical execution plan
        run: python3 scripts/check_nfcore_plan.py

      - name: Govern migration policy
        run: python scripts/ci/migration_guard.py --check-policy

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest

      - name: Python dependency audit
        run: |
          python -m pip install "pip-audit==2.10.1"
          pip-audit --progress-spinner off .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend
        run: npm install --no-audit --no-fund

      - name: Node dependency audit
        run: npm audit --audit-level=high

      - name: Frontend lint
        run: npm run lint:frontend

      - name: Frontend typecheck
        run: npm run typecheck:frontend

      - name: Frontend tests
        run: npm run test:frontend

      - name: Frontend build
        run: npm run build:frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E critical
        run: npm run test:e2e

      - name: Upload portal UX evidence
        uses: actions/upload-artifact@v4
        with:
          name: nfcore-portal-ux-${{ github.sha }}
          path: .artifacts/p02-t07/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Validate compose
        run: docker compose config --quiet

      - name: Validate operational scripts
        run: |
          sh -n scripts/postgres_backup.sh
          sh -n scripts/postgres_restore.sh
          sh -n scripts/ci/staging_preflight.sh
          sh -n scripts/ci/staging_smoke.sh
          sh -n scripts/ci/run_staging_deploy.sh
          sh -n scripts/deploy/drivers/railway.sh
          sh -n scripts/ci/production_preflight.sh
          sh -n scripts/ci/production_smoke.sh
          sh -n scripts/ci/run_production_promotion.sh
          bash -n deploy/contabo/preflight-cog02.sh
          bash -n deploy/contabo/test-preflight-cog02.sh
          bash -n deploy/contabo/activate-code-only-host.sh
          bash deploy/contabo/test-preflight-cog02.sh
          if NFCORE_HOST_CONTRACT_APPROVED=false bash deploy/contabo/activate-code-only-host.sh --install; then
            echo 'UNSAFE: host activation accepted without explicit approval' >&2
            exit 1
          fi

      - name: Build runtime images
        run: |
          docker build -f Dockerfile.api -t nfcore-api:test .
          docker build -f Dockerfile.worker -t nfcore-worker:test .
          docker build -f Dockerfile.portal -t nfcore-portal:test .

      - name: Validate non-root images
        run: |
          test "$(docker image inspect nfcore-api:test --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect nfcore-worker:test --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect nfcore-portal:test --format '{{.Config.User}}')" = "10001:10001"

      - name: Reject insecure production profile
        run: |
          if docker run --rm \
            -e NFCORE_ENVIRONMENT=production \
            -e NFCORE_PERSISTENCE_BACKEND=sqlite \
            -e NFCORE_SECRET_BACKEND=memory \
            -e NFCORE_REQUIRE_HTTPS=false \
            nfcore-api:test; then
            echo "insecure production profile unexpectedly started"
            exit 1
          fi

      - name: API container smoke and readiness
        run: |
          docker run -d --name nfcore-api-smoke --network host \
            -e NFCORE_ENVIRONMENT=staging \
            -e NFCORE_PERSISTENCE_BACKEND=postgres \
            -e DATABASE_URL="$NFCORE_TEST_POSTGRES_DSN" \
            -e NFCORE_SECRET_BACKEND=external \
            -e NFCORE_REQUIRE_HTTPS=true \
            nfcore-api:test
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/health/live
          curl --fail http://127.0.0.1:8080/health/ready
          curl --fail http://127.0.0.1:8080/internal/metrics >/tmp/nfcore-metrics.json
          ! grep -Eqi 'password|authorization|private key|begin certificate|csc=' /tmp/nfcore-metrics.json
          test "$(docker inspect nfcore-api-smoke --format '{{.State.Running}}')" = "true"
          docker stop --time 10 nfcore-api-smoke
          docker rm nfcore-api-smoke

      - name: Worker container startup and governed exit
        run: |
          docker run --rm --network host \
            -e NFCORE_ENVIRONMENT=staging \
            -e NFCORE_PERSISTENCE_BACKEND=postgres \
            -e DATABASE_URL="$NFCORE_TEST_POSTGRES_DSN" \
            -e NFCORE_SECRET_BACKEND=external \
            -e NFCORE_REQUIRE_HTTPS=true \
            -e NFCORE_WORKER_ONESHOT=true \
            nfcore-worker:test
          python scripts/ci/check_worker_container.py

      - name: Portal container smoke
        run: |
          docker run -d --name nfcore-portal-smoke --network host nfcore-portal:test
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8081/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8081/ >/dev/null
          docker stop --time 10 nfcore-portal-smoke
          docker rm nfcore-portal-smoke

      - name: Inspect images for forbidden secret artifacts
        run: |
          for image in nfcore-api:test nfcore-worker:test nfcore-portal:test; do
            if docker history --no-trunc "$image" | grep -Ei 'PASSWORD=|PRIVATE KEY|BEGIN CERTIFICATE|CSC='; then
              echo "forbidden secret material found in image history: $image"
              exit 1
            fi
          done

      - name: Container vulnerability policy
        run: |
          for image in nfcore-api:test nfcore-worker:test nfcore-portal:test; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.74.0 image \
              --quiet --exit-code 1 --ignore-unfixed --severity CRITICAL "$image"
          done

      - name: Generate image SBOMs
        run: |
          mkdir -p .artifacts/sbom
          for image in nfcore-api:test nfcore-worker:test nfcore-portal:test; do
            output="$(echo "$image" | tr ':/' '--').cdx.json"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.artifacts/sbom:/out" \
              aquasec/trivy:0.74.0 image \
              --quiet --format cyclonedx --output "/out/$output" "$image"
          done

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@v4
        with:
          name: nfcore-image-sbom-${{ github.sha }}
          path: .artifacts/sbom/*.cdx.json
          retention-days: 14

      - name: PostgreSQL backup and restore rehearsal
        run: |
          mkdir -p .tmp-backup
          docker run --rm --network host \
            -e PGPASSWORD=nfcore_test_password postgres:16-alpine \
            psql -h 127.0.0.1 -U nfcore -d nfcore_test -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE IF NOT EXISTS wp08_restore_sentinel (id integer PRIMARY KEY, value text NOT NULL);" \
            -c "INSERT INTO wp08_restore_sentinel (id,value) VALUES (1,'restore-ok') ON CONFLICT (id) DO UPDATE SET value=EXCLUDED.value;"
          docker run --rm --network host \
            -v "$PWD:/workspace" -w /workspace \
            -e DATABASE_URL="$NFCORE_TEST_POSTGRES_DSN" postgres:16-alpine \
            sh scripts/postgres_backup.sh .tmp-backup/nfcore.dump
          # Restore into a fresh isolated database, not the source DB.
          # E2E tests can leave disposable named schemas in the source DB;
          # recreating those inside the same DB caused CREATE SCHEMA collisions.
          docker run --rm --network host \
            -e PGPASSWORD=nfcore_test_password postgres:16-alpine \
            psql -h 127.0.0.1 -U nfcore -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE nfcore_restore_test;"
          RESTORE_DATABASE_URL="${NFCORE_TEST_POSTGRES_DSN%/nfcore_test}/nfcore_restore_test"
          docker run --rm --network host \
            -v "$PWD:/workspace" -w /workspace \
            -e DATABASE_URL="$RESTORE_DATABASE_URL" postgres:16-alpine \
            sh scripts/postgres_restore.sh .tmp-backup/nfcore.dump
          test "$(docker run --rm --network host -e PGPASSWORD=nfcore_test_password postgres:16-alpine psql -h 127.0.0.1 -U nfcore -d nfcore_restore_test -Atqc "SELECT value FROM wp08_restore_sentinel WHERE id=1")" = "restore-ok"
          test "$(docker run --rm --network host -e PGPASSWORD=nfcore_test_password postgres:16-alpine psql -h 127.0.0.1 -U nfcore -d nfcore_restore_test -Atqc "SELECT COUNT(*) FROM fm_schema_migrations")" -gt 0

      - name: Application readiness against restored database
        env:
          NFCORE_ENVIRONMENT: staging
          NFCORE_PERSISTENCE_BACKEND: postgres
          DATABASE_URL: postgresql://nfcore:nfcore_test_password@127.0.0.1:5432/nfcore_restore_test
          NFCORE_SECRET_BACKEND: external
          NFCORE_REQUIRE_HTTPS: "true"
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from kordena_fiscal.runtime.api import create_runtime_app

          with TestClient(create_runtime_app()) as client:
              response = client.get('/health/ready')
              assert response.status_code == 200, response.text
          PY
