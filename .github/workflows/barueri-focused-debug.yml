name: Barueri PMB004 focused debug

on:
  push:
    branches:
      - "ci/barueri-targeted-20261114"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python
        run: python -m pip install -e ".[dev]"
      - name: Barueri focused regression
        run: |
          pytest -q tests/gateway/test_barueri_pmb004_homologation.py tests/gateway/test_barueri_pmb004_cancellation_builder.py tests/gateway/test_barueri_official_cancel_return.py tests/runtime/test_barueri_environment.py
          pytest -q tests/web/test_native_nfse_preparation_http.py -k barueri
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Portal UI contract
        run: |
          node --test tests/frontend/portal_contract.test.js
