name: NFCore Economia - validacao focal T04
on:
  push:
    branches: ["validation/nfcore-economy-foundation-20261120"]
permissions:
  contents: read
concurrency:
  group: nfcore-economy-foundation-validation
  cancel-in-progress: true
jobs:
  t04:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nfcore_test
          POSTGRES_USER: nfcore
          POSTGRES_PASSWORD: nfcore_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nfcore -d nfcore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NFCORE_TEST_POSTGRES_DSN: postgresql://nfcore:nfcore_test_password@127.0.0.1:5432/nfcore_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f5f489153907cb129b6eb7b78a4aedac07e348e4
      - name: Confirmar HEAD T04
        run: test "$(git rev-parse HEAD)" = "f5f489153907cb129b6eb7b78a4aedac07e348e4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,telemetry]"
      - run: ruff check .
      - run: mypy
      - run: python scripts/ci/migration_guard.py --check-policy
      - name: Fiscal, normative, cognitive and PostgreSQL regression
        run: |
          pytest -ra --junitxml=/tmp/nfcore-t04.xml tests/tax tests/compliance tests/cognitive tests/persistence/test_economy_schema_postgres.py tests/persistence/test_postgres_production.py::test_economy_v25_readiness_detects_policy_and_index_drift tests/control_plane/test_v2_12_closure.py::test_v2_12_structural_secret_dependency_architecture_and_product_neutrality
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("/tmp/nfcore-t04.xml").getroot()
          cases = root.findall(".//testcase")
          focal = [c for c in cases if "test_simples_nacional" in c.get("classname", "")]
          assert len(focal) >= 20, len(focal)
          assert not root.findall(".//failure") and not root.findall(".//error")
          assert not any(c.find("skipped") is not None for c in focal)
          print(f"T04: {len(focal)} targeted cases PASS; total {len(cases)} regression cases")
          print(f"Regression skips: {len(root.findall('.//skipped'))}")
          PY
