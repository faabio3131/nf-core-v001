name: NFCore Economia - validacao focal T03
on:
  push:
    branches: ["validation/nfcore-economy-foundation-20261120"]
permissions:
  contents: read
concurrency:
  group: nfcore-economy-foundation-validation
  cancel-in-progress: true
jobs:
  t03:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nfcore_test
          POSTGRES_USER: nfcore
          POSTGRES_PASSWORD: nfcore_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nfcore -d nfcore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NFCORE_TEST_POSTGRES_DSN: postgresql://nfcore:nfcore_test_password@127.0.0.1:5432/nfcore_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ea33b304640f668ce6d334657aa0e53305655ff5
      - name: Confirmar HEAD T03
        run: test "$(git rev-parse HEAD)" = "ea33b304640f668ce6d334657aa0e53305655ff5"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,telemetry]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Migration policy
        run: python scripts/ci/migration_guard.py --check-policy
      - name: Normative sentinel, cognitive and PostgreSQL regression
        run: |
          pytest -ra --junitxml=/tmp/nfcore-t03.xml tests/compliance tests/cognitive tests/test_cognitive_router_and_sentinel.py tests/persistence/test_economy_schema_postgres.py tests/persistence/test_postgres_production.py::test_economy_v25_readiness_detects_policy_and_index_drift
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("/tmp/nfcore-t03.xml").getroot()
          cases = root.findall(".//testcase")
          focal = [c for c in cases if "test_normative_radar" in c.get("classname", "")]
          assert len(focal) >= 6, len(focal)
          assert not root.findall(".//failure") and not root.findall(".//error")
          assert not root.findall(".//skipped"), "no skipped tests in selected suites"
          print(f"T03: {len(focal)} targeted cases PASS; total {len(cases)} regression cases")
          PY
      - name: Validate production opt-in composition
        run: |
          POSTGRES_PASSWORD=fixture-only docker compose -f deploy/contabo/compose.prod.yml -f deploy/contabo/compose.normative-radar.api.opt-in.yml config --quiet
