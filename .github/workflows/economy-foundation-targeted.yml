name: NFCore Economia - validacao focal T02
on:
  push:
    branches: ["validation/nfcore-economy-foundation-20261120"]
permissions:
  contents: read
concurrency:
  group: nfcore-economy-foundation-validation
  cancel-in-progress: true
jobs:
  t02:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nfcore_test
          POSTGRES_USER: nfcore
          POSTGRES_PASSWORD: nfcore_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nfcore -d nfcore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NFCORE_TEST_POSTGRES_DSN: postgresql://nfcore:nfcore_test_password@127.0.0.1:5432/nfcore_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b587903ccfb7260cae3b6cde69fcab7907f8e73c
      - name: Confirmar HEAD T02
        run: test "$(git rev-parse HEAD)" = "b587903ccfb7260cae3b6cde69fcab7907f8e73c"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,telemetry]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Migration policy
        run: python scripts/ci/migration_guard.py --check-policy
      - name: Cognitive core and real PostgreSQL regressions
        run: |
          pytest -ra --junitxml=/tmp/nfcore-t02.xml tests/cognitive tests/persistence/test_economy_schema_postgres.py tests/persistence/test_postgres_production.py::test_economy_v25_readiness_detects_policy_and_index_drift
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("/tmp/nfcore-t02.xml").getroot()
          cases = root.findall(".//testcase")
          selected = [c for c in cases if "test_economy_contract" in c.get("classname","") or c.get("name","").startswith(("test_economy_contract_api", "test_real_postgres_economy_schema", "test_economy_v25_readiness"))]
          assert len(selected) >= 20, len(selected)
          assert not root.findall(".//failure") and not root.findall(".//error")
          assert not any(c.find("skipped") is not None for c in selected)
          print(f"T02: {len(selected)} targeted cases PASS; total {len(cases)} regression cases")
          print(f"Regression skips: {len(root.findall('.//skipped'))}")
          PY
