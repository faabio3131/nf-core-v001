name: T09 Missing State Source Recovery (AC RR SE)
on:
  workflow_dispatch:
  pull_request:
    branches:
      - work/nfcore-closeout-20261119
    paths:
      - "docs/NFCORE_T09_RETRY_OFFICIAL_SOURCES_3UFS_V1.json"
      - ".github/workflows/nfcore-t09-retry-3ufs.yml"
permissions:
  contents: read
jobs:
  retry-official-sources:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact T09 candidate
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recover official text from three unavailable jurisdictions
        run: |
          python scripts/nfcore_t09_capture_alternatives.py \
            --catalog docs/NFCORE_T09_STATE_BENEFIT_DRAFT_CANDIDATES_V1.json \
            --alternatives docs/NFCORE_T09_RETRY_OFFICIAL_SOURCES_3UFS_V1.json \
            --output t09-retry-3ufs-evidence --timeout 25 --workers 5
      - name: Preserve original response bytes, no legal approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t09-retry-3ufs-legal-source-evidence-unreviewed
          path: |
            t09-retry-3ufs-evidence/alternative_capture_manifest.json
            t09-retry-3ufs-evidence/nfcore_t09_official_alternatives_unreviewed.zip
          if-no-files-found: error
          retention-days: 30
